sonar.projectKey=porteken_ai-resume-analyzer-app
sonar.organization=porteken

sonar.sources=src,e2e
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/testing/**,e2e/**
sonar.exclusions=src/components/ui/**,src/lib/utils.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/testing/**,e2e/**

sonar.qualitygate.wait=true