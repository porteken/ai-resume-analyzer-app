name: CI and Deploy

on:
  push:
    branches:
      - dev
      - prd
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PLAYWRIGHT_E2E_SHARDS: 5

jobs:
  quality-checks:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run tsc
      - run: pnpm exec knip

  vitest-unit:
    name: Vitest Unit (shard ${{ matrix.shard_index }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run test:unit --reporter=blob --shard=${{ matrix.shard_index }}/2

      - name: Upload Vitest unit blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-unit-blob-${{ matrix.shard_index }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  merge-vitest-unit:
    name: Merge Vitest Unit Reports
    needs: vitest-unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download Vitest unit blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: all-vitest-unit-blob-reports
          pattern: vitest-unit-blob-*
          merge-multiple: true

      - name: Merge Vitest unit reports
        run: pnpm exec vitest --merge-reports=./all-vitest-unit-blob-reports --reporter=junit

  playwright-e2e:
    name: Playwright E2E (shard ${{ matrix.shard_index }}/5)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers & OS Deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright Shard
        run: pnpm exec playwright test --shard=${{ matrix.shard_index }}/${{ env.PLAYWRIGHT_E2E_SHARDS }} --reporter=list,blob

      - name: Upload Playwright Blob
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-blob-${{ matrix.shard_index }}
          path: blob-report/*.zip
          retention-days: 1

  merge-playwright:
    name: Merge Playwright Reports
    needs: playwright-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download All Playwright Blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: playwright-blobs
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: pnpm exec playwright merge-reports --reporter=line,html ./playwright-blobs
        shell: bash

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Check for test failures
        if: needs.playwright-e2e.result == 'failure'
        run: |
          echo "Playwright tests failed in the e2e job. Failing the merge job."
          exit 1

  vitest-coverage:
    name: Vitest Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Vitest with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report for SonarQube
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: SonarQube
    needs: vitest-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download Vitest coverage
        if: github.ref_name != 'prd'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vitest-coverage
          path: coverage

      - name: SonarQube Scan
        if: github.ref_name != 'prd'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        with:
          args: >
            -Dsonar.scm.revision=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to Vercel
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prd')
    needs: [quality-checks, vitest-unit, playwright-e2e, sonarqube]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK: ${{ github.ref_name == 'prd' && secrets.VERCEL_DEPLOY_HOOK_PRD || secrets.VERCEL_DEPLOY_HOOK_DEV }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK for ${{ github.ref_name }} is not set in Repository Secrets."
            exit 1
          fi

          echo "Triggering Vercel deployment for branch: ${{ github.ref_name }}"
          curl -X POST "$VERCEL_DEPLOY_HOOK"
