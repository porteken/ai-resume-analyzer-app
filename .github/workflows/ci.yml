name: CI and Deploy

on:
  push:
    branches:
      - dev
      - prd

  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CI: "true"

jobs:
  quality-checks:
    name: Format, Lint, and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --ignore-scripts

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run tsc

  vitest:
    name: Vitest (${{ matrix.shard_index }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --ignore-scripts

      - name: Run Vitest shard without coverage
        if: github.event_name == 'push' && github.ref_name == 'prd'
        run: >
          pnpm exec vitest run
          --shard=${{ matrix.shard_index }}/${{ strategy.job-total }}
          --reporter=blob
          --outputFile=vitest-blob-${{ matrix.shard_index }}-of-${{ strategy.job-total }}.json

      - name: Run Vitest shard with coverage
        if: github.event_name != 'push' || github.ref_name != 'prd'
        run: >
          pnpm exec vitest run
          --shard=${{ matrix.shard_index }}/${{ strategy.job-total }}
          --reporter=blob
          --coverage
          --outputFile=vitest-blob-${{ matrix.shard_index }}-of-${{ strategy.job-total }}.json

      - name: Upload Vitest blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-blob-${{ matrix.shard_index }}
          path: vitest-blob-${{ matrix.shard_index }}-of-${{ strategy.job-total }}.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1

  merge-vitest:
    name: Merge Vitest Reports
    needs: vitest
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --ignore-scripts

      - name: Download Vitest blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: all-vitest-reports
          pattern: vitest-blob-*
          merge-multiple: true

      - name: Verify Vitest blob reports
        shell: bash
        run: |
          set -euo pipefail

          report_count="$(
            find ./all-vitest-reports \
              -maxdepth 1 \
              -type f \
              -name 'vitest-blob-*.json' \
              | wc -l
          )"

          echo "Found ${report_count} Vitest blob reports."

          if [ "${report_count}" -ne 5 ]; then
            echo "::error::Expected 5 Vitest blob reports, but found ${report_count}."
            exit 1
          fi

      - name: Merge Vitest reports without coverage
        if: github.event_name == 'push' && github.ref_name == 'prd'
        run: >
          pnpm exec vitest
          --merge-reports=./all-vitest-reports
          --reporter=default
          --reporter=junit
          --outputFile.junit=vitest-junit.xml

      - name: Merge Vitest reports and coverage
        if: github.event_name != 'push' || github.ref_name != 'prd'
        run: >
          pnpm exec vitest
          --merge-reports=./all-vitest-reports
          --reporter=default
          --reporter=junit
          --outputFile.junit=vitest-junit.xml
          --coverage
          --coverage.reporter=lcov
          --coverage.reporter=text-summary

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-junit
          path: vitest-junit.xml
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Upload merged Vitest coverage
        if: >
          !cancelled() &&
          (github.event_name != 'push' || github.ref_name != 'prd')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Fail when a Vitest shard failed
        if: needs.vitest.result != 'success'
        shell: bash
        run: |
          echo "::error::One or more Vitest shards failed."
          exit 1

  playwright-e2e:
    name: Playwright E2E (${{ matrix.shard_index }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      E2E_USE_RUNTIME_MOCKS: "false"
      NEXT_PUBLIC_E2E_TEST: "true"

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --ignore-scripts

      - name: Install Playwright browsers and OS dependencies
        run: >
          pnpm exec playwright install
          --with-deps
          chromium
          firefox
          webkit
      - name: Run Playwright shard
        run: pnpm exec playwright test --shard=${{ matrix.shard_index }}/5 --reporter=list,blob

      - name: Upload Playwright Blob
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-blob-${{ matrix.shard_index }}
          path: blob-report/*.zip
          retention-days: 1

  merge-playwright:
    name: Merge Playwright Reports
    needs: playwright-e2e
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --ignore-scripts

      - name: Download Playwright blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: playwright-blobs
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge Playwright reports
        id: merge_reports
        run: >
          pnpm exec playwright merge-reports
          --reporter=line,html
          ./playwright-blobs

      - name: Upload Playwright HTML report
        if: steps.merge_reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Fail when a Playwright shard failed
        if: needs.playwright-e2e.result != 'success'
        shell: bash
        run: |
          echo "::error::One or more Playwright shards failed."
          exit 1

  sonarqube:
    name: SonarQube
    needs: merge-vitest

    if: >
      !cancelled() &&
      github.ref_name != 'prd' &&
      needs.merge-vitest.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Download Vitest coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vitest-coverage
          path: coverage

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        with:
          args: >
            -Dsonar.scm.revision=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to Vercel

    needs:
      - quality-checks
      - merge-vitest
      - merge-playwright
      - sonarqube

    if: >
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      (github.ref_name == 'dev' || github.ref_name == 'prd') &&
      needs.quality-checks.result == 'success' &&
      needs.merge-vitest.result == 'success' &&
      needs.merge-playwright.result == 'success' &&
      (
        needs.sonarqube.result == 'success' ||
        (
          github.ref_name == 'prd' &&
          needs.sonarqube.result == 'skipped'
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Trigger Vercel deploy hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK: ${{ github.ref_name == 'prd' && secrets.VERCEL_DEPLOY_HOOK_PRD || secrets.VERCEL_DEPLOY_HOOK_DEV }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK for ${GITHUB_REF_NAME} is not configured."
            exit 1
          fi

          echo "Triggering Vercel deployment for branch: ${GITHUB_REF_NAME}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            "${VERCEL_DEPLOY_HOOK}"
